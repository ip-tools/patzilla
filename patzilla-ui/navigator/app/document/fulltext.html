<span data-area="text">
<strong><%= title %></strong> <%= language ? '[' + language + ']' : '' %>
<div class="keyword"><%= content %></div>

<div class="text-align-right text-small text-muted">
    Fulltext data source: <span class="datasource-label"><%= datasource %></span>
</div>
<% } %>
</span>
