<!-- Menu for actions on the current stack. -->
<md-menu class="stack-menu" positioning="fixed">
    <md-menu-item data-action="edit">
        <span slot="start" class="material-icons" aria-hidden="true">comment</span>
        <span slot="headline">Edit</span>
        <span slot="supporting-text">Bulk-edit selected documents</span>
        <span slot="trailing-supporting-text">⎇+E</span>
    </md-menu-item>
    <md-menu-item data-action="share">
        <span slot="start" class="material-icons" aria-hidden="true">share</span>
        <span slot="headline">Share</span>
        <span slot="supporting-text">Share documents with others</span>
        <span slot="trailing-supporting-text">⎇+S</span>
    </md-menu-item>
    <% if (navigatorApp.options.theme.get('feature.xpexport.enabled')) { %>
    <md-menu-item data-action="xpexport">
        <span slot="start" class="material-icons" aria-hidden="true">forward</span>
        <span slot="headline">Transfer to XPAT</span>
        <span slot="trailing-supporting-text">⎇+X</span>
    </md-menu-item>
    <% } %>
    <md-menu-item data-action="reset">
        <span slot="start" class="material-icons" aria-hidden="true">clear_all</span>
        <span slot="headline">Reset</span>
        <span slot="supporting-text">Clear list of selections</span>
        <span slot="trailing-supporting-text">⎇+R</span>
    </md-menu-item>
</md-menu>
