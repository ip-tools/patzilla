<!-- This template is used in regular mode -->

    <div class="pagination-chooser">

        <span class="col-md-auto">
            <span class="pagination medium">
                <a href="#" class="first" data-action="first">&laquo;</a>
                <a href="#" class="previous" data-action="previous">&lsaquo;</a>
                <input type="text" readonly="readonly" />
                <a href="#" class="next" data-action="next">&rsaquo;</a>
                <a href="#" class="last" data-action="last">&raquo;</a>
            </span>
        </span>

        <span class="col col-md-2">
            <span class="btn-group page-size-chooser">
                <button class="btn btn-outline-dark btn-sm dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-resize-vertical"></i> &nbsp; Page size: <%= page_size %>
                </button>
                <ul class="dropdown-menu">
                </ul>
            </span>
        </span>

    </div>
