<div class="d-flex justify-content-between">

    <div id="project-name-editor" class="d-inline text-large">
        <sup>｢</sup>
        <a id="project-chooser-name" href="#" data-type="text" data-pk="1" data-title="Project name"></a>
        <sub>｣</sub>
    </div>

    <span id="project-chooser-actions" class="do-not-print">
        <div id="project-chooser-list" class="btn-group">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-toggle="dropdown">
            </button>
            <!-- This dropdown will be dynamically populated from the list of project names. -->
            <ul class="dropdown-menu dropdown-menu-right">
            </ul>
        </div>

        <div class="btn-group">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-toggle="dropdown">
                <i class="glyphicon glyphicon-tasks"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-right">

                <li>

                    <!-- A. project -->
                    <div class="dropdown-section-header">Project</div>

                    <!-- new project -->
                    <a id="project-create-button" class="dropdown-item">
                        <i class="glyphicon glyphicon-plus glyphicon-large"></i> &nbsp; Create new project
                    </a>

                    <!-- delete project -->
                    <a id="project-delete-button" class="dropdown-item">
                        <i class="glyphicon glyphicon-trash glyphicon-large"></i> &nbsp; Delete current project
                    </a>

                    <hr class="divider"/>


                    <!-- Import project -->
                    <a id="project-import-button" class="dropdown-item">
                        <i class="glyphicon glyphicon-folder-open glyphicon-large"></i> &nbsp; Import from JSON file
                    </a>
                    <input type="file" id="project-import-file" class="display-none"/>

                    <!-- Export project -->
                    <a id="project-export-button" class="dropdown-item">
                        <i class="glyphicon glyphicon-save glyphicon-large"></i> &nbsp; Export to JSON file
                    </a>

                    <hr class="divider"/>


                    <!-- B. mode -->
                    <div class="dropdown-section-header">
                        Display mode
                    </div>

                    <!-- fade "seen" mode -->
                    <a id="mode-seen-fade-button" class="dropdown-item">
                        <div class="checkbox">
                            <label>
                                <input type="checkbox" id="mode-seen-fade"> Fade »seen« documents
                            </label>
                        </div>
                    </a>

                </li>
            </ul>

        </div>

    </span>

</div>
