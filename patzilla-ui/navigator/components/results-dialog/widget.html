// Modal dialog for displaying arbitrary results
// ---------------------------------------------
%>

<div class="modal-dialog modal-medium" role="document">
<div class="modal-content">

<div class="modal-header">
    <h3 class="modal-title" id="result-label">Results</h3>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div id="result-info">
    </div>
    <br/>
    <textarea id="result-content" rows="13" cols="80" style="width: 97%"></textarea>

</div>
<div class="modal-footer row justify-content-between">
  <div class="col-auto">
    <a id="result-to-basket-button" role="button" class="btn btn-secondary">
        <i class="glyphicon glyphicon-plus" id="result-to-basket-indicator"></i> &nbsp; Add to document collection
    </a>
    <a id="result-to-clipboard-button" role="button" class="btn btn-secondary">
        <i class="glyphicon glyphicon-copy"></i> &nbsp; Copy to clipboard
    </a>
  </div>
  <div class="col-2">
    <button class="btn btn-outline-secondary" data-dismiss="modal">Close</button>
  </div>
</div>

</div>
</div>
