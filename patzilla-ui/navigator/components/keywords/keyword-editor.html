<div class="modal-dialog" role="document">
<div class="modal-content">

<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <h3 class="modal-title" id="keyword-editor-label">Keyword editor</h3>
</div>
<div class="modal-body">
    Edit keywords for individual highlighting
    <br/><br/>
    <table class="table table-condensed">
        <thead>
            <tr>
                <th class="col-md-10">Keywords</th>
                <th class="col-md-2">Style</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
<div class="modal-footer">
    <button class="btn btn-default" id="keyword-editor-save-button" type="button">Save</button>
    <button class="btn btn-default" data-dismiss="modal" aria-hidden="true">Close</button>
</div>

</div>
</div>
