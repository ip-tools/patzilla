name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

  # Allow job to be triggered manually.
  workflow_dispatch:

# Cancel in-progress jobs when pushing to the same branch.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:

  tests-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          #- 'macos-latest'
          # When installing packages: `PermissionError: [WinError 5] Access is denied`
          # - 'windows-latest'
        python-version:
          - '3.10'
          - '3.15'

    defaults:
      run:
        shell: bash

    env:
      OPS_API_CONSUMER_KEY: ${{ secrets.OPS_API_CONSUMER_KEY }}
      OPS_API_CONSUMER_SECRET: ${{ secrets.OPS_API_CONSUMER_SECRET }}
      IFICLAIMS_API_URI: ${{ secrets.IFICLAIMS_API_URI }}
      IFICLAIMS_API_USERNAME: ${{ secrets.IFICLAIMS_API_USERNAME }}
      IFICLAIMS_API_PASSWORD: ${{ secrets.IFICLAIMS_API_PASSWORD }}
      UV_LINK_MODE: copy

    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:

    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Install dependencies for Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt install --yes pdftk-java poppler-utils

    - name: Install dependencies for macOS
      if: runner.os == 'macOS'
      run: |
        brew install poppler

    - name: Configure policy for ImageMagick
      # https://stackoverflow.com/q/52998331
      # https://stackoverflow.com/a/57721936
      if: runner.os == 'Linux'
      run: |
        sudo rm /etc/ImageMagick-6/policy.xml

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        activate-environment: true
        cache-suffix: ${{ matrix.python-version }}
        enable-cache: true
        python-version: ${{ matrix.python-version }}
        version: 'latest'

    - name: Setup project
      run: |
        uv pip install pip virtualenv
        make setup-test

    - name: Run tests
      run: make test-coverage options="--app-cache-backend=memory"

    # https://github.com/codecov/codecov-action
    - name: Upload coverage results to Codecov
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true

  tests-docs:
    runs-on: "ubuntu-latest"

    defaults:
      run:
        shell: bash

    name: Build documentation
    steps:

    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        activate-environment: true
        enable-cache: true
        python-version: 3.15
        version: 'latest'

    - name: Invoke Sphinx
      run: |
        uv pip install -r requirements-docs.txt
        cd docs; make html

  tests-ui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
          #- 'macos-latest'
          #- 'windows-latest'
        node-version:
          - '24'

    defaults:
      run:
        shell: bash

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    steps:

    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        architecture: x64
        cache: 'yarn'
        cache-dependency-path: 'yarn.lock'

    - name: Setup project
      run: yarn install

    - name: Run build
      run: yarn build

    - name: Run release
      run: yarn release
